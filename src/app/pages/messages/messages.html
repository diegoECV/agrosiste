<div class="messages">
  <!-- Header -->
  <div class="messages-header">
    <h1>Mensajes</h1>
    <button class="btn-compose">
      <ion-icon name="create-outline"></ion-icon>
      <span>Nuevo Mensaje</span>
    </button>
  </div>

  <!-- Messages Layout -->
  <div class="messages-layout">
    <!-- Sidebar de conversaciones -->
    <div class="conversations-panel">
      <div class="conversations-search">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" placeholder="Buscar conversación...">
      </div>

      <div class="conversations-tabs">
        <button class="tab-btn active">
          Todos
          <span class="tab-badge">0</span>
        </button>
        <button class="tab-btn">No leídos</button>
        <button class="tab-btn">Archivados</button>
      </div>

      <div class="conversations-list">
        <div class="empty-conversations">
          <ion-icon name="chatbubbles-outline"></ion-icon>
          <h3>Sin conversaciones</h3>
          <p>Los mensajes aparecerán aquí</p>
        </div>
      </div>
    </div>

    <!-- Panel de chat -->
    <div class="chat-panel">
      <div class="chat-empty">
        <div class="chat-empty-content">
          <ion-icon name="mail-unread-outline"></ion-icon>
          <h2>Selecciona una conversación</h2>
          <p>Elige un mensaje de la lista o inicia una nueva conversación</p>
          <button class="btn-start-chat">
            <ion-icon name="add-outline"></ion-icon>
            Iniciar Conversación
          </button>
        </div>
      </div>
    </div>

    <!-- Panel de detalles -->
    <div class="details-panel">
      <div class="details-header">
        <h2>Detalles</h2>
      </div>

      <div class="details-content">
        <div class="detail-avatar">
          <ion-icon name="person-circle-outline"></ion-icon>
        </div>
        <h3>--</h3>
        <span class="detail-role">--</span>

        <div class="detail-info-list">
          <div class="detail-info-item">
            <ion-icon name="mail-outline"></ion-icon>
            <span>--</span>
          </div>
          <div class="detail-info-item">
            <ion-icon name="call-outline"></ion-icon>
            <span>--</span>
          </div>
          <div class="detail-info-item">
            <ion-icon name="location-outline"></ion-icon>
            <span>--</span>
          </div>
        </div>

        <div class="detail-actions">
          <button class="detail-action-btn">
            <ion-icon name="archive-outline"></ion-icon>
            Archivar
          </button>
          <button class="detail-action-btn danger">
            <ion-icon name="trash-outline"></ion-icon>
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
